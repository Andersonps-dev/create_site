<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título até ~60 caracteres: serviço principal + cidade | marca -->
  <title>SERVIÇO em CIDADE | %VITE_MARCA%</title>
  <!-- 140 a 160 caracteres: serviço, cidade, chamada para ação -->
  <meta name="description" content="PREENCHER">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="%VITE_SITE_URL%/">
  <meta name="theme-color" content="#111111">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="%VITE_MARCA%">
  <meta property="og:title" content="SERVIÇO em CIDADE | %VITE_MARCA%">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="%VITE_MARCA%">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Dados estruturados: troque LocalBusiness pelo subtipo certo (HVACBusiness, Dentist, Restaurant, LegalService…).
       FAQ aqui precisa ter o mesmo texto da FAQ da página. Sem AggregateRating inventado. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "WebSite", "@id": "%VITE_SITE_URL%/#website", "url": "%VITE_SITE_URL%/", "name": "%VITE_MARCA%", "inLanguage": "pt-BR" },
      {
        "@type": "LocalBusiness",
        "@id": "%VITE_SITE_URL%/#business",
        "name": "%VITE_NOME_FANTASIA%",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/img/og-image.jpg",
        "logo": "%VITE_SITE_URL%/icon-512.png",
        "telephone": "+%VITE_WHATSAPP%",
        "email": "%VITE_EMAIL%",
        "taxID": "%VITE_CNPJ%",
        "address": { "@type": "PostalAddress", "streetAddress": "PREENCHER", "addressLocality": "PREENCHER", "addressRegion": "UF", "addressCountry": "BR" },
        "areaServed": [{ "@type": "City", "name": "PREENCHER" }],
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "18:00" }
        ],
        "sameAs": ["https://www.instagram.com/PREENCHER/"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog", "name": "Serviços",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "PREENCHER" } }
          ]
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "PERGUNTA?", "acceptedAnswer": { "@type": "Answer", "text": "RESPOSTA." } }
        ]
      }
    ]
  }
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<header class="site-header" data-header>
  <div class="container nav">
    <a href="/" class="brand"><img src="/img/mark-96.webp" width="40" height="40" alt=""><span>%VITE_MARCA%</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menu"><span></span></button>
    <nav id="site-nav" class="nav-links" aria-label="Principal">
      <a href="#servicos">Serviços</a>
      <a href="#sobre">Sobre</a>
      <a href="#duvidas">Dúvidas</a>
      <a href="#contato">Contato</a>
    </nav>
  </div>
</header>

<main id="conteudo">
  <!-- Banner: H1 com serviço + cidade, 1 frase curta, 1 botão, elemento visual forte -->
  <section class="hero" data-enter>
    <div class="container">
      <div class="hero-copy">
        <h1>SERVIÇO em <span>CIDADE</span></h1>
        <a class="btn" href="https://wa.me/%VITE_WHATSAPP%?text=Ol%C3%A1!%20Gostaria%20de%20um%20or%C3%A7amento.">Pedir orçamento</a>
      </div>
    </div>
  </section>

  <section class="sec" id="servicos" aria-labelledby="servicos-titulo">
    <div class="container"><h2 class="sec-title" id="servicos-titulo">Serviços</h2></div>
  </section>

  <section class="sec" id="sobre" aria-labelledby="sobre-titulo">
    <div class="container"><h2 class="sec-title" id="sobre-titulo">Sobre</h2></div>
  </section>

  <section class="sec" id="duvidas" aria-labelledby="duvidas-titulo">
    <div class="container"><h2 class="sec-title" id="duvidas-titulo">Perguntas frequentes</h2></div>
  </section>

  <section class="sec" id="contato" aria-labelledby="contato-titulo">
    <div class="container"><h2 class="sec-title" id="contato-titulo">Contato</h2></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>%VITE_NOME_FANTASIA% • %VITE_ENDERECO% • %VITE_TELEFONE%</p>
    <p>© <span data-year>2026</span> %VITE_NOME_FANTASIA% • CNPJ %VITE_CNPJ% • <a href="/politica-de-privacidade">Política de Privacidade</a></p>
  </div>
</footer>
</body>
</html>
